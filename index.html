<script>
const camera = document.getElementById("camera");
const canvasOutput = document.getElementById("canvasOutput");
const button = document.getElementById("startCamera");
const resetTrackingButton = document.getElementById("resetTracking");
const status = document.getElementById("status");
const coordX = document.getElementById("coordX");
const coordY = document.getElementById("coordY");
const detectedStatus = document.getElementById("detectedStatus");
const trackingStatus = document.getElementById("trackingStatus");
const playerInfo = document.getElementById("playerInfo");
const runAnimationButton = document.getElementById("runAnimation");
const ctx = canvasOutput.getContext("2d");

let stream = null;
let isOpenCvReady = false;
let isProcessing = false;

// ========================================
// SCREEN LOCK + FEATURE TRACKING
// ========================================

let screenLocked = false;
let lockedQuad = null;
let previousGray = null;
let previousPoints = null;

let anchorX = 0.5;
let anchorY = 0.5;

let lastGoodXY = { x: 0.5, y: 0.5 };
let smoothedXY = { x: 0.5, y: 0.5 };

let lostFrames = 0;

const XY_SMOOTHING_ALPHA = 0.22;
const XY_DEADBAND = 0.0015;

const MAX_FEATURES = 250;
const MIN_FEATURES = 8;
const MIN_INLIERS = 8;
const MAX_TRACK_ERROR = 35;

const MIN_AREA_RATIO = 0.025;
const MAX_AREA_RATIO = 0.92;

// ========================================
// CONSTELLATION ZONE SETTINGS
// ========================================

// ต้องอยู่ในเขตกลุ่มดาวครบ 3 วินาที
const DISCOVERY_TIME = 3000;

// ตัวอย่างพื้นที่ 12 กลุ่มดาว
// พิกัด X/Y อยู่ในช่วง 0 ถึง 1
// X = ซ้ายไปขวา
// Y = บนลงล่าง
//
// ตอนนี้แบ่งหน้าจอเป็น 4 คอลัมน์ x 3 แถว
// ต้องปรับพิกัดให้ตรงกับตำแหน่งกลุ่มดาวจริงภายหลัง

const CONSTELLATION_ZONES = [
  { id: "aries",    name: "Aries",    x1: 0.00, y1: 0.00, x2: 0.25, y2: 0.333 },
  { id: "taurus",   name: "Taurus",   x1: 0.25, y1: 0.00, x2: 0.50, y2: 0.333 },
  { id: "gemini",   name: "Gemini",   x1: 0.50, y1: 0.00, x2: 0.75, y2: 0.333 },
  { id: "cancer",   name: "Cancer",   x1: 0.75, y1: 0.00, x2: 1.00, y2: 0.333 },

  { id: "leo",      name: "Leo",      x1: 0.00, y1: 0.333, x2: 0.25, y2: 0.666 },
  { id: "virgo",    name: "Virgo",    x1: 0.25, y1: 0.333, x2: 0.50, y2: 0.666 },
  { id: "libra",    name: "Libra",    x1: 0.50, y1: 0.333, x2: 0.75, y2: 0.666 },
  { id: "scorpio",  name: "Scorpio",  x1: 0.75, y1: 0.333, x2: 1.00, y2: 0.666 },

  { id: "sagittarius", name: "Sagittarius", x1: 0.00, y1: 0.666, x2: 0.25, y2: 1.00 },
  { id: "capricorn",   name: "Capricorn",   x1: 0.25, y1: 0.666, x2: 0.50, y2: 1.00 },
  { id: "aquarius",    name: "Aquarius",    x1: 0.50, y1: 0.666, x2: 0.75, y2: 1.00 },
  { id: "pisces",      name: "Pisces",      x1: 0.75, y1: 0.666, x2: 1.00, y2: 1.00 }
];

let currentZone = null;
let zoneStartTime = null;
let discoveredZone = null;
let waitingForExit = false;
let discoveryReady = false;

function isInsideZone(x, y, zone) {
  return (
    x >= zone.x1 &&
    x <= zone.x2 &&
    y >= zone.y1 &&
    y <= zone.y2
  );
}

function findZone(x, y) {
  return CONSTELLATION_ZONES.find(zone =>
    isInsideZone(x, y, zone)
  ) || null;
}

function hideDiscoveryButton() {
  runAnimationButton.style.display = "none";
  discoveryReady = false;
}

function resetZoneDetection() {
  currentZone = null;
  zoneStartTime = null;
  discoveredZone = null;
  waitingForExit = false;
  hideDiscoveryButton();
}

function updateZoneDetection(x, y) {
  const zone = findZone(x, y);

  // ผู้เล่นออกจากเขต
  if (!zone) {
    currentZone = null;
    zoneStartTime = null;
    discoveredZone = null;
    waitingForExit = false;

    hideDiscoveryButton();
    return;
  }

  // หลังจากกดปุ่มแล้ว ต้องออกจากเขตก่อน
  // จึงจะเริ่มค้นพบกลุ่มดาวใหม่ได้
  if (waitingForExit) return;

  // เปลี่ยนไปยังเขตกลุ่มดาวอื่น
  if (!currentZone || currentZone.id !== zone.id) {
    currentZone = zone;
    zoneStartTime = performance.now();
    discoveredZone = null;
    hideDiscoveryButton();

    status.textContent =
      "กำลังค้นพบกลุ่มดาว " + zone.name + "...";

    return;
  }

  // ยังไม่ครบ 3 วินาที
  if (!discoveryReady) {
    const elapsed = performance.now() - zoneStartTime;

    if (elapsed >= DISCOVERY_TIME) {
      discoveredZone = zone;
      discoveryReady = true;

      runAnimationButton.style.display = "block";
      runAnimationButton.disabled = false;

      status.textContent =
        "ค้นพบกลุ่มดาว " + zone.name + " แล้ว!";
    }
  }
}

// ========================================
// OPENCV READY
// ========================================

function onOpenCvReady() {
  if (typeof cv === "undefined") return;

  cv.onRuntimeInitialized = () => {
    if (isOpenCvReady) return;

    isOpenCvReady = true;
    status.textContent = "OpenCV พร้อมใช้งาน";
    button.textContent = "Open Camera";
    button.disabled = false;
  };

  if (cv.Mat && !isOpenCvReady) {
    isOpenCvReady = true;
    status.textContent = "OpenCV พร้อมใช้งาน";
    button.textContent = "Open Camera";
    button.disabled = false;
  }
}

function setTargetStatus(found) {
  detectedStatus.textContent = found ? "LOCKED" : "NO";
  detectedStatus.style.color =
    found ? "#0bf4ec" : "#ff4d4d";
}

function setTrackingStatus(found) {
  trackingStatus.textContent = found ? "ACTIVE" : "HOLD";
  trackingStatus.style.color =
    found ? "#0bf4ec" : "#ffcf5a";
}

function displayCoordinates(x, y) {
  coordX.textContent = Number(x).toFixed(3);
  coordY.textContent = Number(y).toFixed(3);
}

// ========================================
// WEBSOCKET
// ========================================

const WS_ENDPOINT =
  "wss://rentals-rolled-minds-pond.trycloudflare.com";

let socket = null;
let playerId = null;
let lastXYSendTime = 0;

function connectWebSocket() {
  if (socket &&
      [WebSocket.OPEN, WebSocket.CONNECTING].includes(socket.readyState)) {
    return;
  }

  socket = new WebSocket(WS_ENDPOINT);

  socket.addEventListener("open", () => {
    playerInfo.textContent =
      "เชื่อมต่อแล้ว กำลังรับ Player ID...";
  });

  socket.addEventListener("message", event => {
    try {
      const data = JSON.parse(event.data);

      if (data.type === "welcome") {
        playerId = data.playerId;
        playerInfo.textContent =
          `Player ${playerId} / เชื่อมต่อแล้ว`;

        if (stream) sendPlayerActive(true);

      } else if (data.type === "error") {
        playerInfo.textContent =
          data.message || "Server error";
      }

    } catch (e) {
      console.warn("WebSocket parse error", e);
    }
  });

  socket.addEventListener("close", () => {
    playerId = null;
    playerInfo.textContent =
      "เชื่อมต่อหลุด กำลัง reconnect...";

    setTimeout(connectWebSocket, 1500);
  });

  socket.addEventListener("error", () => {
    playerInfo.textContent =
      "WebSocket เชื่อมต่อไม่สำเร็จ";
  });
}

function wsSend(data) {
  if (socket?.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify(data));
    return true;
  }

  return false;
}

function sendPlayerActive(active) {
  wsSend({
    type: "active",
    active: Boolean(active)
  });
}

function sendXYToTouchDesigner(x, y) {
  const now = performance.now();

  if (now - lastXYSendTime < 50) return;

  lastXYSendTime = now;

  wsSend({
    type: "xy",
    x: Math.max(0, Math.min(1, Number(x))),
    y: Math.max(0, Math.min(1, Number(y)))
  });
}

// ========================================
// ANIMATION BUTTON
// ========================================

runAnimationButton.addEventListener("click", () => {
  if (!discoveryReady || !discoveredZone) return;

  if (!wsSend({ type: "runAnimation" })) {
    status.textContent =
      "ยังไม่เชื่อมต่อเซิร์ฟเวอร์ จึงส่งคำสั่งไม่ได้";
    return;
  }

  const name = discoveredZone.name;

  status.textContent =
    "ส่งคำสั่งเล่นอนิเมชัน " + name + " ไป TouchDesigner แล้ว";

  // ซ่อนปุ่มหลังจากกด
  hideDiscoveryButton();

  // ต้องออกจากพื้นที่ก่อนจึงจะค้นพบใหม่ได้
  waitingForExit = true;
});

// เริ่มเชื่อมต่อ
connectWebSocket();

// ========================================
// GEOMETRY
// ========================================

function polygonArea(points) {
  let area = 0;

  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];

    area += a.x * b.y - b.x * a.y;
  }

  return Math.abs(area / 2);
}

function centerOf(points) {
  return {
    x: points.reduce((s, p) => s + p.x, 0) / points.length,
    y: points.reduce((s, p) => s + p.y, 0) / points.length
  };
}

function orderQuad(points) {
  const center = centerOf(points);

  const sorted = points.slice().sort((a, b) =>
    Math.atan2(a.y - center.y, a.x - center.x) -
    Math.atan2(b.y - center.y, b.x - center.x)
  );

  let start = 0;
  let minSum = Infinity;

  sorted.forEach((p, i) => {
    const sum = p.x + p.y;

    if (sum < minSum) {
      minSum = sum;
      start = i;
    }
  });

  let ordered = sorted.slice(start).concat(sorted.slice(0, start));

  const cross =
    (ordered[1].x - ordered[0].x) *
    (ordered[2].y - ordered[1].y) -
    (ordered[1].y - ordered[0].y) *
    (ordered[2].x - ordered[1].x);

  if (cross < 0) {
    ordered = [
      ordered[0], ordered[3],
      ordered[2], ordered[1]
    ];
  }

  if (ordered[1].x < ordered[3].x) {
    ordered = [
      ordered[0], ordered[3],
      ordered[2], ordered[1]
    ];
  }

  return ordered;
}

// ========================================
// FIRST SCREEN DETECTION
// ========================================

function extractCandidates(srcMat, width, height) {
  const candidates = [];

  const gray = new cv.Mat();
  const blurred = new cv.Mat();
  const edges = new cv.Mat();
  const closed = new cv.Mat();
  const contours = new cv.MatVector();
  const hierarchy = new cv.Mat();
  const kernel = cv.getStructuringElement(
    cv.MORPH_RECT,
    new cv.Size(9, 9)
  );

  try {
    cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
    cv.Canny(blurred, edges, 22, 85);
    cv.morphologyEx(edges, closed, cv.MORPH_CLOSE, kernel);

    cv.findContours(
      closed,
      contours,
      hierarchy,
      cv.RETR_LIST,
      cv.CHAIN_APPROX_SIMPLE
    );

    const imageArea = width * height;

    for (let i = 0; i < contours.size(); i++) {
      const contour = contours.get(i);
      const approx = new cv.Mat();

      try {
        const areaRatio =
          Math.abs(cv.contourArea(contour)) / imageArea;

        if (areaRatio < MIN_AREA_RATIO ||
            areaRatio > MAX_AREA_RATIO) continue;

        const perimeter = cv.arcLength(contour, true);
        let found = false;

        for (const eps of [0.018, 0.025, 0.035, 0.045]) {
          cv.approxPolyDP(
            contour,
            approx,
            eps * perimeter,
            true
          );

          if (approx.rows === 4 &&
              cv.isContourConvex(approx)) {
            found = true;
            break;
          }
        }

        if (!found) continue;

        const points = [];

        for (let j = 0; j < 4; j++) {
          const p = approx.intPtr(j, 0);
          points.push({ x: p[0], y: p[1] });
        }

        const ordered = orderQuad(points);
        const area = polygonArea(ordered);
        const xs = ordered.map(p => p.x);
        const ys = ordered.map(p => p.y);

        const w = Math.max(...xs) - Math.min(...xs);
        const h = Math.max(...ys) - Math.min(...ys);

        if (w < width * 0.18 ||
            h < height * 0.10) continue;

        const aspect = w / Math.max(h, 1);

        if (aspect < 1.10 || aspect > 2.80) continue;

        candidates.push({
          points: ordered,
          area,
          center: centerOf(ordered)
        });

      } finally {
        approx.delete();
        contour.delete();
      }
    }

  } finally {
    gray.delete();
    blurred.delete();
    edges.delete();
    closed.delete();
    contours.delete();
    hierarchy.delete();
    kernel.delete();
  }

  candidates.sort((a, b) => b.area - a.area);
  return candidates;
}

// ========================================
// FEATURE MASK
// ========================================

function createScreenMask(gray, quad) {
  const mask = cv.Mat.zeros(
    gray.rows,
    gray.cols,
    cv.CV_8UC1
  );

  const points = cv.matFromArray(
    4, 1, cv.CV_32SC2,
    quad.flatMap(p => [
      Math.round(p.x),
      Math.round(p.y)
    ])
  );

  const polygons = new cv.MatVector();
  polygons.push_back(points);

  try {
    cv.fillPoly(
      mask,
      polygons,
      new cv.Scalar(255)
    );
  } finally {
    points.delete();
    polygons.delete();
  }

  return mask;
}

function detectFeatures(gray, quad, maxCount = MAX_FEATURES) {
  const mask = createScreenMask(gray, quad);
  const corners = new cv.Mat();

  try {
    cv.goodFeaturesToTrack(
      gray,
      corners,
      maxCount,
      0.008,
      7,
      mask,
      5,
      false,
      0.04
    );

    return corners.clone();

  } finally {
    mask.delete();
    corners.delete();
  }
}

// ========================================
// INITIALIZE TRACKING
// ========================================

function initializeTracking(gray, quad) {
  if (previousGray) previousGray.delete();
  if (previousPoints) previousPoints.delete();

  previousGray = gray.clone();
  previousPoints = detectFeatures(gray, quad);

  if (previousPoints.rows < MIN_FEATURES) {
    console.warn("Feature points น้อยเกินไป:", previousPoints.rows);
    return false;
  }

  const center = mapCameraCenter(quad);

  if (!center) return false;

  anchorX = center.x;
  anchorY = center.y;

  smoothedXY = { x: 0.5, y: 0.5 };
  lastGoodXY = { x: 0.5, y: 0.5 };

  displayCoordinates(0.5, 0.5);
  sendXYToTouchDesigner(0.5, 0.5);

  console.log(
    "Screen locked. Feature points:",
    previousPoints.rows
  );

  return true;
}

// ========================================
// MAP CAMERA CENTER
// ========================================

function mapCameraCenter(quad) {
  let src = null;
  let dst = null;
  let transform = null;
  let point = null;
  let result = null;

  try {
    src = cv.matFromArray(
      4, 1, cv.CV_32FC2,
      quad.flatMap(p => [p.x, p.y])
    );

    dst = cv.matFromArray(
      4, 1, cv.CV_32FC2,
      [0, 0, 1, 0, 1, 1, 0, 1]
    );

    transform = cv.getPerspectiveTransform(src, dst);

    point = cv.matFromArray(
      1, 1, cv.CV_32FC2,
      [camera.videoWidth / 2, camera.videoHeight / 2]
    );

    result = new cv.Mat();

    cv.perspectiveTransform(point, result, transform);

    const x = result.data32F[0];
    const y = result.data32F[1];

    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;

    return { x, y };

  } catch (e) {
    console.warn("mapCameraCenter:", e);
    return null;

  } finally {
    [src, dst, transform, point, result].forEach(m => {
      if (m) m.delete();
    });
  }
}

// ========================================
// OPTICAL FLOW TRACKING
// ========================================

function pointInsideQuad(point, quad) {
  let inside = false;

  for (let i = 0, j = quad.length - 1;
       i < quad.length;
       j = i++) {

    const xi = quad[i].x;
    const yi = quad[i].y;
    const xj = quad[j].x;
    const yj = quad[j].y;

    const intersect =
      ((yi > point.y) !== (yj > point.y)) &&
      (point.x <
        (xj - xi) * (point.y - yi) /
        ((yj - yi) || 0.00001) + xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

function trackScreen(gray) {
  if (!previousGray || !previousPoints ||
      previousPoints.rows < MIN_FEATURES) {
    return false;
  }

  let nextPoints = new cv.Mat();
  let statusMat = new cv.Mat();
  let errorMat = new cv.Mat();
  let homography = null;
  let inlierMask = null;
  let oldInliers = null;
  let newInliers = null;
  let quadMat = null;
  let movedQuadMat = null;
  let freshPoints = null;

  try {
    const winSize = new cv.Size(31, 31);

    cv.calcOpticalFlowPyrLK(
      previousGray,
      gray,
      previousPoints,
      nextPoints,
      statusMat,
      errorMat,
      winSize,
      3,
      new cv.TermCriteria(
        cv.TERM_CRITERIA_EPS | cv.TERM_CRITERIA_COUNT,
        30,
        0.01
      )
    );

    const oldData = previousPoints.data32F;
    const newData = nextPoints.data32F;
    const statuses = statusMat.data;
    const errors = errorMat.data32F;

    const srcList = [];
    const dstList = [];

    for (let i = 0; i < statuses.length; i++) {
      if (!statuses[i]) continue;
      if (errors[i] > MAX_TRACK_ERROR) continue;

      const ox = oldData[i * 2];
      const oy = oldData[i * 2 + 1];
      const nx = newData[i * 2];
      const ny = newData[i * 2 + 1];

      if (!Number.isFinite(nx) || !Number.isFinite(ny)) continue;

      srcList.push(ox, oy);
      dstList.push(nx, ny);
    }

    const count = srcList.length / 2;

    if (count < MIN_INLIERS) return false;

    oldInliers = cv.matFromArray(
      count, 1, cv.CV_32FC2, srcList
    );

    newInliers = cv.matFromArray(
      count, 1, cv.CV_32FC2, dstList
    );

    inlierMask = new cv.Mat();

    homography = cv.findHomography(
      oldInliers,
      newInliers,
      cv.RANSAC,
      3,
      inlierMask
    );

    if (homography.empty()) return false;

    let inlierCount = 0;
    const maskData = inlierMask.data;

    for (let i = 0; i < maskData.length; i++) {
      if (maskData[i]) inlierCount++;
    }

    if (inlierCount < MIN_INLIERS) return false;

    quadMat = cv.matFromArray(
      4, 1, cv.CV_32FC2,
      lockedQuad.flatMap(p => [p.x, p.y])
    );

    movedQuadMat = new cv.Mat();

    cv.perspectiveTransform(
      quadMat,
      movedQuadMat,
      homography
    );

    const q = movedQuadMat.data32F;

    const newQuad = [
      { x: q[0], y: q[1] },
      { x: q[2], y: q[3] },
      { x: q[4], y: q[5] },
      { x: q[6], y: q[7] }
    ];

    if (newQuad.some(p =>
      !Number.isFinite(p.x) ||
      !Number.isFinite(p.y) ||
      Math.abs(p.x) > gray.cols * 3 ||
      Math.abs(p.y) > gray.rows * 3
    )) {
      return false;
    }

    lockedQuad = newQuad;

    const currentCenter = mapCameraCenter(lockedQuad);

    if (!currentCenter) return false;

    const rawX = 0.5 + (currentCenter.x - anchorX);
    const rawY = 0.5 + (currentCenter.y - anchorY);

    const x = Math.max(0, Math.min(1, rawX));
    const y = Math.max(0, Math.min(1, rawY));

    let dx = x - smoothedXY.x;
    let dy = y - smoothedXY.y;

    if (Math.abs(dx) < XY_DEADBAND) dx = 0;
    if (Math.abs(dy) < XY_DEADBAND) dy = 0;

    smoothedXY = {
      x: Math.max(0, Math.min(1,
        smoothedXY.x + dx * XY_SMOOTHING_ALPHA)),
      y: Math.max(0, Math.min(1,
        smoothedXY.y + dy * XY_SMOOTHING_ALPHA))
    };

    lastGoodXY = { ...smoothedXY };

    const tracked = [];

    for (let i = 0; i < statuses.length; i++) {
      if (!statuses[i] || errors[i] > MAX_TRACK_ERROR) continue;

      const p = {
        x: newData[i * 2],
        y: newData[i * 2 + 1]
      };

      if (pointInsideQuad(p, lockedQuad)) {
        tracked.push(p.x, p.y);
      }
    }

    freshPoints = detectFeatures(gray, lockedQuad, MAX_FEATURES);
    const fresh = freshPoints.data32F;

    for (let i = 0; i < fresh.length; i += 2) {
      if (tracked.length / 2 >= MAX_FEATURES) break;

      const x2 = fresh[i];
      const y2 = fresh[i + 1];

      let tooClose = false;

      for (let j = 0; j < tracked.length; j += 2) {
        if (Math.hypot(
          tracked[j] - x2,
          tracked[j + 1] - y2
        ) < 9) {
          tooClose = true;
          break;
        }
      }

      if (!tooClose) tracked.push(x2, y2);
    }

    if (tracked.length / 2 >= MIN_FEATURES) {
      const replacement = cv.matFromArray(
        tracked.length / 2,
        1,
        cv.CV_32FC2,
        tracked
      );

      previousPoints.delete();
      previousPoints = replacement;
    } else {
      return false;
    }

    previousGray.delete();
    previousGray = gray.clone();

    lostFrames = 0;

    displayCoordinates(lastGoodXY.x, lastGoodXY.y);
    sendXYToTouchDesigner(lastGoodXY.x, lastGoodXY.y);

    // ตรวจจับเขตกลุ่มดาวจาก X/Y ล่าสุด
    updateZoneDetection(lastGoodXY.x, lastGoodXY.y);

    return true;

  } catch (error) {
    console.warn("Optical Flow tracking:", error);
    return false;

  } finally {
    [
      nextPoints,
      statusMat,
      errorMat,
      homography,
      inlierMask,
      oldInliers,
      newInliers,
      quadMat,
      movedQuadMat,
      freshPoints
    ].forEach(m => {
      if (m) m.delete();
    });
  }
}

// ========================================
// DRAW OVERLAYS
// ========================================

function drawPolygon(mat, points, color, thickness) {
  const scalar = color === "cyan"
    ? new cv.Scalar(11, 244, 236, 255)
    : new cv.Scalar(255, 180, 0, 255);

  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];

    cv.line(
      mat,
      new cv.Point(Math.round(a.x), Math.round(a.y)),
      new cv.Point(Math.round(b.x), Math.round(b.y)),
      scalar,
      thickness
    );
  }
}

function drawFeatures(mat, points) {
  if (!points) return;

  const data = points.data32F;

  for (let i = 0; i < data.length; i += 2) {
    cv.circle(
      mat,
      new cv.Point(
        Math.round(data[i]),
        Math.round(data[i + 1])
      ),
      2,
      new cv.Scalar(0, 255, 150, 255),
      -1
    );
  }
}

// ========================================
// VIDEO LOOP
// ========================================

function processVideo() {
  if (!isProcessing) return;

  if (!camera.videoWidth || !camera.videoHeight) {
    requestAnimationFrame(processVideo);
    return;
  }

  const width = camera.videoWidth;
  const height = camera.videoHeight;

  if (canvasOutput.width !== width ||
      canvasOutput.height !== height) {
    canvasOutput.width = width;
    canvasOutput.height = height;
  }

  ctx.drawImage(camera, 0, 0, width, height);

  let srcMat = null;
  let gray = null;

  try {
    srcMat = cv.imread(canvasOutput);
    gray = new cv.Mat();

    cv.cvtColor(srcMat, gray, cv.COLOR_RGBA2GRAY);

    if (!screenLocked) {
      const candidates = extractCandidates(
        srcMat,
        width,
        height
      );

      if (candidates.length > 0) {
        const chosen = candidates[0];

        lockedQuad = chosen.points.map(p => ({
          x: p.x,
          y: p.y
        }));

        const initialized =
          initializeTracking(gray, lockedQuad);

        if (initialized) {
          screenLocked = true;

          setTargetStatus(true);
          setTrackingStatus(true);

          status.textContent =
            "ล็อกจอสำเร็จ! ขยับกล้องเพื่อควบคุมวงกลมได้";

          console.log("SCREEN LOCKED");
        } else {
          lockedQuad = null;
          status.textContent =
            "พบขอบจอแล้ว แต่จุดดาวยังไม่เพียงพอ กรุณารอ";
        }
      } else {
        status.textContent =
          "กำลังค้นหาขอบจอ... กรุณาจัดกล้องให้เห็นจอครบทั้ง 4 มุม";
      }

      if (!screenLocked) {
        candidates.forEach(c => {
          drawPolygon(srcMat, c.points, "orange", 2);
        });
      }

    } else {
      const tracked = trackScreen(gray);

      if (tracked) {
        setTargetStatus(true);
        setTrackingStatus(true);

        // สถานะการค้นพบถูกอัปเดตใน updateZoneDetection()
        if (!discoveryReady && !waitingForExit) {
          status.textContent =
            "ล็อกจอแล้ว / กำลังติดตามภาพดาว";
        }

      } else {
        lostFrames++;

        setTargetStatus(true);
        setTrackingStatus(false);

        // หากภาพติดตามหาย ให้หยุดการนับเวลา
        currentZone = null;
        zoneStartTime = null;
        hideDiscoveryButton();

        displayCoordinates(
          lastGoodXY.x,
          lastGoodXY.y
        );

        status.textContent =
          "ล็อกจออยู่ / ภาพติดตามขาดชั่วคราว กำลังคงพิกัดล่าสุด";
      }

      if (lockedQuad) {
        drawPolygon(srcMat, lockedQuad, "cyan", 3);
      }

      drawFeatures(srcMat, previousPoints);
    }

    cv.imshow(canvasOutput, srcMat);

  } catch (error) {
    console.error("OpenCV error:", error);
    status.textContent =
      "เกิดข้อผิดพลาด ดูรายละเอียดใน Console";

  } finally {
    if (srcMat) srcMat.delete();
    if (gray) gray.delete();
  }

  requestAnimationFrame(processVideo);
}

// ========================================
// RESET TRACKER
// ========================================

function resetTracker() {
  if (previousGray) {
    previousGray.delete();
    previousGray = null;
  }

  if (previousPoints) {
    previousPoints.delete();
    previousPoints = null;
  }

  screenLocked = false;
  lockedQuad = null;
  lostFrames = 0;

  anchorX = 0.5;
  anchorY = 0.5;

  lastGoodXY = { x: 0.5, y: 0.5 };
  smoothedXY = { x: 0.5, y: 0.5 };

  resetZoneDetection();

  setTargetStatus(false);
  setTrackingStatus(false);
  displayCoordinates(0.5, 0.5);
}

// รีเซ็ตการล็อกสี่เหลี่ยม โดยไม่ปิดกล้อง
resetTrackingButton.addEventListener("click", () => {
  if (!stream || !isProcessing) {
    status.textContent = "กรุณาเปิดกล้องก่อนรีเซ็ตการตรวจจับ";
    return;
  }

  resetTracker();
  status.textContent = "รีเซ็ตแล้ว กำลังค้นหาขอบจอใหม่...";
});

// ========================================
// CAMERA ON / OFF
// ========================================

button.addEventListener("click", async () => {
  if (!isOpenCvReady) return;

  if (stream) {
    isProcessing = false;
    sendPlayerActive(false);

    stream.getTracks().forEach(track => track.stop());

    stream = null;
    camera.srcObject = null;

    resetTracker();

    ctx.clearRect(
      0, 0,
      canvasOutput.width,
      canvasOutput.height
    );

    button.textContent = "Open Camera";
    status.textContent = "Open Camera";

    return;
  }

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        "กรุณาเปิดเว็บผ่าน HTTPS หรือ localhost"
      );
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    camera.srcObject = stream;

    await camera.play();

    resetTracker();

    isProcessing = true;
    sendPlayerActive(true);

    button.textContent = "Close Camera";

    status.textContent =
      "กล้องพร้อมแล้ว กำลังค้นหาขอบจอครั้งแรก";

    requestAnimationFrame(processVideo);

  } catch (error) {
    status.textContent =
      "เปิดกล้องไม่สำเร็จ: " + error.message;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    stream = null;
    isProcessing = false;
    sendPlayerActive(false);
  }
});

// ========================================
// CLEANUP
// ========================================

window.addEventListener("pagehide", () => {
  sendPlayerActive(false);

  isProcessing = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  if (socket) socket.close();

  resetTracker();
});

window.addEventListener("load", () => {
  if (typeof cv !== "undefined" && cv.Mat) {
    onOpenCvReady();
  }
});
</script>
